# reaktivo.pro и reaktivo.ru. API (api/sb.reaktivo.pro) остаётся в reaktivo-proxy.

server {
    listen 80;
    listen [::]:80;
    server_name reaktivo.pro www.reaktivo.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://reaktivo.pro$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reaktivo.pro;

    ssl_certificate /etc/letsencrypt/live/reaktivo.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reaktivo.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;
    root /var/www/reaktivo-pro;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        include snippets/render-proxy.conf;
    }

    location = /sb {
        include snippets/render-proxy.conf;
    }

    location /sb/ {
        include snippets/render-proxy.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

