# COLD BACKUP ONLY.
# Боевой API: Node на VPS (systemd reaktivo-api) за nginx → 127.0.0.1:8787.
# См. scripts/ops/README.md и scripts/migrate-vps-a-to-local-api.sh.
# После миграции: Suspend этот сервис / выключить Auto-Deploy.
#
# Секреты: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (legacy eyJ…)
services:
  - type: web
    name: gold-calculated-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
